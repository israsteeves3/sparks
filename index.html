<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Homepage</title>
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="home_v1.css">
</head>

<body>
    <img id="home" src="Final_logo.png" alt="A word mark logo for Your Sparks. Inside the S in Sparks is a cartoon star.">
            <div class="login_card" id="login">
            <h1>Login</h1>
            <p>Login to Continue</p>
            <form>
                <input type="email" placeholder="Email">
                <br>
                <input type="password" placeholder="Password">
                <br>
                <div id="remember">
                <input type="checkbox">
                <p>Remember me</p>
                </div>
                <a class="sub" href="home.html">Login</a>
            </form>
            <p>Don't have a login? <button class="sign" id="sign">Sign up</button></p>
        </div>
        <div class="signup_card" id="signup">
            <h1>Sign Up</h1>
            <form>
                <input id="sign_email" type="email" placeholder="Email">
                <br>
                <input id="pass" type="password" placeholder="Password">
                <br>
                <input id="sign_pass" type="password" placeholder="Confirm Password">
                <br>
                <a class="sub" href="home.html">submit</a>
            </form>
            <p>Have a login? <button class="sign" id="logButton">Login</button></p>
        </div>

    <script src="home_v1.js"></script>   
    </body>
</html>
